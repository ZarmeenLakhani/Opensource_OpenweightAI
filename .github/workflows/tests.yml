name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The tests replay a scripted model, so no model server and no openai SDK are needed.
      - run: python -m unittest discover -v tests
      # The CLI imports the openai SDK lazily; this checks the whole package at least imports.
      - run: python -m compileall -q lifegraph tests
